# Prometheus scrape config. The API exposes /metrics; Prometheus pulls it
# every 5s so recommendation latency, QPS, and cache-hit-rate become graphable.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: reco-api
    static_configs:
      # The API runs on the host (go run cmd/api), so scrape via the
      # docker host gateway alias defined in docker-compose.yml.
      - targets: ["host.docker.internal:8080"]
